[package]
name = "curamsec"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "curam security core — classify / scan_context / match_host / check_pkg"

[lib]
name = "curamsec"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "curam-run"
path = "src/bin/curam_run.rs"

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py38", "extension-module"] }
sha2 = "0.10"
regex = "1"
aho-corasick = "1"
serde_json = "1"

[profile.release]
lto = true
