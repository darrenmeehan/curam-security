name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      # bwrap (the cage) needs user namespaces; the "Let bwrap nest" step below
      # lifts the AppArmor restriction that blocks them on ubuntu-latest.
      - name: Install bwrap + nft
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap nftables iproute2

      # ubuntu-latest is 26.04 now: AppArmor restricts unprivileged user
      # namespaces, so bwrap cannot create its own and every cage test fails
      # with "setting up uid map: Permission denied". This turns the
      # restriction off for the rest of the job.
      - name: Let bwrap nest
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
          fi

      - name: Build curam-run (debug, for tests)
        run: cargo build --bin curam-run

      - name: Rust tests
        run: cargo test

      - name: Build + install wheel (maturin abi3)
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          # maturin defaults to target/wheels; the install below reads dist/.
          maturin build --interpreter python --out dist
          python -m pip install dist/curamsec-*.whl

      - name: Python tests (curamsec + cage + contract replay)
        env:
          CURAM_RUN_BIN: ${{ github.workspace }}/target/debug/curam-run
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q
          node tests/contract_stub.js
          python tests/cage_integration.py
