[package]
name = "curamsec"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "curam security core — pyo3 shim over curam-core (abi3 wheel)"

[lib]
name = "curamsec"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py38", "extension-module"] }
curam-core = { path = "../curam-core" }